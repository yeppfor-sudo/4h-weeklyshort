name: MEXC 4H Pattern Scanner

on:
  schedule:
    - cron: "2 */4 * * *"   # every 4 hours (UTC), 2 min after candle close
  workflow_dispatch:         # manual run button

permissions:
  contents: write            # needed to save sent_alerts.json

concurrency:
  group: mexc-4h-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save alert state (24h dedupe)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json || true
          git diff --cached --quiet || (git commit -m "update alert state" && git push)
